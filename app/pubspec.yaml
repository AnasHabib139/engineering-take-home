name: diary_app
description: Symptom diary app for patients.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Atkinson Hyperlegible
      fonts:
        - asset: fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
